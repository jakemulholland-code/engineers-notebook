# Builds the Windows installer when a version tag (v*) is pushed and attaches it,
# with the signed updater files and latest.json, to a draft GitHub Release.
# Publish the draft to make it the version the in-app updater offers.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Engineer's Notebook ${{ github.ref_name }}"
          releaseBody: |
            Download **Engineers.Notebook_*_x64-setup.exe** below and run it.
            Windows SmartScreen will warn because the installer is not code-signed: choose More info, then Run anyway.
            Once installed, the app updates itself from new releases.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles nsis
